name: Set up Docker Buildx (resilient)
description: Use upstream pull retries and fall back to an independent registry mirror
inputs:
  buildkit-image:
    description: Pinned BuildKit image used by the docker-container driver
    required: false
    default: moby/buildkit:v0.35.0
  registry-mirror:
    description: Docker Hub pull-through mirror; empty disables fallback
    required: false
    default: mirror.gcr.io
  verbose:
    description: Enable diagnostic output; RUNNER_DEBUG also enables it
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    # Since upstream PR #609, setup-buildx pre-pulls even a locally cached image.
    # Its toolkit owns bounded transient retries. Seeding/retagging a mirror
    # image cannot bypass that canonical pull; retry setup with the mirror image.
    - name: Set up Docker Buildx from canonical registry
      id: canonical
      continue-on-error: true
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=${{ inputs.buildkit-image }}

    - name: Report registry fallback
      if: steps.canonical.outcome == 'failure'
      shell: bash
      env:
        BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
        REGISTRY_MIRROR: ${{ inputs.registry-mirror }}
        VERBOSE: ${{ inputs.verbose }}
      run: |
        set -eu
        if [ "$VERBOSE" = true ] || [ "${RUNNER_DEBUG:-}" = 1 ]; then
          set -x
        fi
        if [ -z "$REGISTRY_MIRROR" ]; then
          echo '::error::Canonical BuildKit setup failed and registry mirror is disabled'
          exit 1
        fi
        echo "Canonical setup failed; retrying with ${REGISTRY_MIRROR}/${BUILDKIT_IMAGE}"

    - name: Set up Docker Buildx from registry mirror
      if: steps.canonical.outcome == 'failure' && inputs.registry-mirror != ''
      uses: docker/setup-buildx-action@v4
      with:
        driver-opts: image=${{ inputs.registry-mirror }}/${{ inputs.buildkit-image }}
