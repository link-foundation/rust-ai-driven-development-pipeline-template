name: Workflows

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

# Keep the workflow read-only unless a job explicitly needs an additional scope.
permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A *native* actionlint binary without shellcheck on
      # PATH silently skips the shell checks and exits 0, which is how the
      # SC2016 defect in release.yml (issue #141) went unnoticed.
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # actionlint cannot see workflow *security* defects: unpinned third-party
      # actions, checkouts that persist `GITHUB_TOKEN` in `.git/config`, or
      # template injection into `run:` blocks. zizmor covers those. Reproduce
      # locally with the same configuration:
      #   pipx run zizmor==1.30.0 --config .github/zizmor.yml \
      #     --min-confidence medium --persona regular .github/workflows
      #
      # Annotations instead of SARIF: forks of this template do not necessarily
      # have code scanning enabled, and the job should fail loudly either way.
      - uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: medium

  # Terminal status gate (issue #156): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status
    needs:
      - actionlint
      - zizmor
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          RUN_SHA: ${{ github.sha }}
          BRANCH_REF: ${{ github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
